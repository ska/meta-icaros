# IcarOS Distro for Wayland.
# Using the downstream kernel flavour.

require conf/distro/include/icaros-base.inc

DISTRO = "icaros-wayland"
DISTRO_NAME = "IcarOS Wayland"
DISTRO_FLAVOUR = ""

# we use graphics, so set opengl
DISTRO_FEATURES:append = " opengl"

DISTRO_FEATURES:append = " wayland"
DISTRO_FEATURES:remove = " x11"

# lxqt requires this
DISTRO_FEATURES:append = " polkit"
