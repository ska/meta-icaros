include conf/distro/poky.conf
# Distro Layer configuration
# include and overwrite default poky distro

DISTRO = "icaros-nas"
DISTRO_NAME = "IcarOS Nas lightweight Disto for low end devices "
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "Guacamole"
SDK_VENDOR = "-icarossdk"
SDK_VERSION = "${DISTRO_VERSION}"
MAINTAINER = "ska@linux.it"

DISTRO_FEATURES:append = " pam"

DISTRO_FEATURES:remove = " opengl"
DISTRO_FEATURES:remove = " wayland"
DISTRO_FEATURES:remove = " x11"
DISTRO_FEATURES:remove = " usbgadget"
DISTRO_FEATURES:remove = " pci"
DISTRO_FEATURES:remove = " bluez5"
DISTRO_FEATURES:remove = " bluetooth"
DISTRO_FEATURES:remove = " wifi"
DISTRO_FEATURES:remove = " alsa"
DISTRO_FEATURES:remove = " pulseaudio"

DISTRO_FEATURES:remove = " pcmcia"
DISTRO_FEATURES:remove = " 3g"
DISTRO_FEATURES:remove = " nfc"
DISTRO_FEATURES:remove = " multiarch"

# Selects sysvinit + initscripts and drops systemd from DISTRO_FEATURES
# (see conf/distro/include/init-manager-sysvinit.inc)
INIT_MANAGER = "sysvinit"
